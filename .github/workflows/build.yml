name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app and CLI
        run: ./build.sh

      - name: Package app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/SystemWidget.app "dist/SystemWidget-${GITHUB_REF_NAME}.zip"

      - name: Build DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemWidget.app
          path: build/SystemWidget.app

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              "dist/SystemWidget-${GITHUB_REF_NAME}.zip" \
              "dist/SystemWidget-${GITHUB_REF_NAME#v}.dmg" \
              --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" \
              "dist/SystemWidget-${GITHUB_REF_NAME}.zip" \
              "dist/SystemWidget-${GITHUB_REF_NAME#v}.dmg" --clobber
